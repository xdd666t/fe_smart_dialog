name: Release & Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build/publish (defaults to refs/heads/main package version)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm CLI (supports OIDC Trusted Publishing & provenance)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag version ($TAG_VER) does not match package.json version ($PKG_VER)"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build library & styles
        run: npm run build

      - name: Build playground
        run: npm run build:playground

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Pack tarball for GitHub Release
        id: pack
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "tag=v$PKG_VER" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: ${{ steps.pack.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.tarball }}

      - name: Check npm auth availability
        id: npm_check
        env:
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          echo "has_token=$NPM_TOKEN_PRESENT" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ steps.npm_check.outputs.has_token }}" != "true" ]; then
            echo "::notice::NPM_TOKEN secret is not configured; attempting OIDC Trusted Publishing (only works if already linked on npmjs.com). For initial publish, add NPM_TOKEN secret under Settings -> Secrets and variables -> Actions, then re-run this job."
          fi
          npm publish --provenance --access public
